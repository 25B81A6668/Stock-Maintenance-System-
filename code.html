<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Maintenance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #1e3a8a;
        }

        button:hover {
            background: #162d6b;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .low-stock {
            color: #dc2626;
            font-weight: bold;
        }

        .in-stock {
            color: #16a34a;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .cards,
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Stock Maintenance System</h1>
    <p>Inventory Management Dashboard</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="cards">
        <div class="card">
            <h3>Total Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <p id="totalStock">0</p>
        </div>

        <div class="card">
            <h3>Low Stock</h3>
            <p id="lowStock">0</p>
        </div>

        <div class="card">
            <h3>Stock Value</h3>
            <p>₹<span id="stockValue">0</span></p>
        </div>
    </div>

    <!-- Add Product -->
    <div class="form-box">
        <h2>Add New Product</h2>

        <div class="form-grid">
            <input type="text" id="productName" placeholder="Product Name">

            <input type="text" id="category" placeholder="Category">

            <input type="number" id="quantity" placeholder="Quantity">

            <input type="number" id="price" placeholder="Price">

            <input type="text" id="supplier" placeholder="Supplier">

            <button onclick="addProduct()">Add Product</button>
        </div>
    </div>

    <!-- Stock Table -->
    <div class="table-box">
        <h2>Stock Details</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Supplier</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="stockTable"></tbody>
        </table>
    </div>

</div>

<script>
    let products = [
        {
            id: 1,
            name: "Laptop",
            category: "Electronics",
            quantity: 15,
            price: 45000,
            supplier: "ABC Electronics"
        },
        {
            id: 2,
            name: "Keyboard",
            category: "Accessories",
            quantity: 5,
            price: 1200,
            supplier: "XYZ Computers"
        },
        {
            id: 3,
            name: "Mouse",
            category: "Accessories",
            quantity: 25,
            price: 700,
            supplier: "Tech Supplies"
        }
    ];

    function displayProducts() {
        const table = document.getElementById("stockTable");
        table.innerHTML = "";

        let totalStock = 0;
        let lowStock = 0;
        let stockValue = 0;

        products.forEach(product => {
            totalStock += product.quantity;
            stockValue += product.quantity * product.price;

            if (product.quantity < 10) {
                lowStock++;
            }

            const status = product.quantity < 10
                ? '<span class="low-stock">Low Stock</span>'
                : '<span class="in-stock">In Stock</span>';

            const row = `
                <tr>
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.quantity}</td>
                    <td>₹${product.price.toLocaleString()}</td>
                    <td>${product.supplier}</td>
                    <td>${status}</td>
                    <td>
                        <button class="delete-btn"
                            onclick="deleteProduct(${product.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

            table.innerHTML += row;
        });

        document.getElementById("totalProducts").textContent =
            products.length;

        document.getElementById("totalStock").textContent =
            totalStock;

        document.getElementById("lowStock").textContent =
            lowStock;

        document.getElementById("stockValue").textContent =
            stockValue.toLocaleString();
    }

    function addProduct() {
        const name = document.getElementById("productName").value;
        const category = document.getElementById("category").value;
        const quantity = Number(document.getElementById("quantity").value);
        const price = Number(document.getElementById("price").value);
        const supplier = document.getElementById("supplier").value;

        if (!name || !category || !quantity || !price || !supplier) {
            alert("Please fill in all fields.");
            return;
        }

        const newProduct = {
            id: products.length > 0
                ? Math.max(...products.map(p => p.id)) + 1
                : 1,
            name,
            category,
            quantity,
            price,
            supplier
        };

        products.push(newProduct);

        document.getElementById("productName").value = "";
        document.getElementById("category").value = "";
        document.getElementById("quantity").value = "";
        document.getElementById("price").value = "";
        document.getElementById("supplier").value = "";

        displayProducts();
    }

    function deleteProduct(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            products = products.filter(product => product.id !== id);
            displayProducts();
        }
    }

    displayProducts();
</script>

</body>
</html>
